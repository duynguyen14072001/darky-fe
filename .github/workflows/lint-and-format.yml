name: Lint and Format

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:

jobs:
  lint-and-format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install

      - name: Check format
        run: yarn format:check

      - name: Lint
        run: yarn lint
